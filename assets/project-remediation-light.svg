<svg xmlns="http://www.w3.org/2000/svg" width="840" height="204" viewBox="0 0 840 204" role="img" aria-label="Auto-Remediation for Windows — Rule-based self-healing. Watches the Windows Event Log in real time, matches events against 50+ rules and runs PowerShell fixes automatically — first-seen issues wait for operator approval, every fix is verified, and a Flutter dashboard shows health, approvals and history. Built with Python, Flask, PowerShell, Flutter, Windows Event Log." font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"><title>Auto-Remediation for Windows — Rule-based self-healing. Watches the Windows Event Log in real time, matches events against 50+ rules and runs PowerShell fixes automatically — first-seen issues wait for operator approval, every fix is verified, and a Flutter dashboard shows health, approvals and history. Built with Python, Flask, PowerShell, Flutter, Windows Event Log.</title><defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#059669"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.77"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/></linearGradient><linearGradient id="sm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0"><stop offset="0" stop-color="#0891B2" stop-opacity="0"/><stop offset=".5" stop-color="#0891B2" stop-opacity=".9"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-240 0;860 0" dur="6s" repeatCount="indefinite"/></linearGradient><filter id="sh" x="-5%" y="-10%" width="110%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity=".09"/></filter></defs><rect x="10" y="10" width="820" height="180" rx="16" fill="url(#gl)" stroke="#CBD5E1" stroke-opacity=".9" filter