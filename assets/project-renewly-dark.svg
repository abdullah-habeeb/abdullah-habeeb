<svg xmlns="http://www.w3.org/2000/svg" width="840" height="204" viewBox="0 0 840 204" role="img" aria-label="Renewly — Automatic subscription tracker. Forgotten subscriptions silently drain money. Renewly reads Gmail (read-only) to detect recurring charges, tracks the true monthly and yearly cost, and emails a reminder before every renewal — built India-first around real bank-alert emails. Built with React, Express, Firebase, Gmail API, Tailwind CSS." font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"><title>Renewly — Automatic subscription tracker. Forgotten subscriptions silently drain money. Renewly reads Gmail (read-only) to detect recurring charges, tracks the true monthly and yearly cost, and emails a reminder before every renewal — built India-first around real bank-alert emails. Built with React, Express, Firebase, Gmail API, Tailwind CSS.</title><defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F172A" stop-opacity="0.70"/><stop offset="1" stop-color="#0F172A" stop-opacity="0.55"/></linearGradient><linearGradient id="sm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".9"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-240 0;860 0" dur="6s" repeatCount="indefinite"/></linearGradient></defs><rect x="10" y="10" width="820" height="180" rx="16" fill="url(#gl)" stroke="#334155" stroke-opacity=".7"/><rect x="26" y="10" width="328" height="1.5" fill="url(#ac)"/><rect x="26" y="10" width="788" height="1.5" fill="url(#sm)"/><clipPath id="cc"><rect x="10" y="10" width="820" height="180" rx="16"/></clipPath><rect x="10" y="10" width="4" height="180" fill="#22D3EE" clip-path="url(#cc)"/><text x="36" y="52" font-size="12" fill="#475569">01</text><text x="64" y="53" font-size="20" font-weight="800" fill="#F8FAFC">Renewly</text><text x="165" y="52" font-size="12" fill="#22D3EE">Automatic subscription tracker</text><rect x="743" y="37" width="63" height="20" rx="10" fill="#10B981" fill-opacity=".12" stroke="#10B981" stroke-opacity=".5"/><circle cx="756" cy="47" r="3" fill="#10B981"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><text x="766" y="50.5" font-size="10" font-weight="700" letter-spacing="1" fill="#10B981">LIVE</text><text x="36" y="86" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#CBD5E1">Forgotten subscriptions silently drain money. Renewly reads Gmail (read-only) to detect</text><text x="36" y="108" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#CBD5E1">recurring charges, tracks the true monthly and yearly cost, and emails a reminder before</text><text x="36" y="130" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#CBD5E1">every renewal — built India-first around real bank-alert emails.</text><rect x="36.0" y="150" width="68.1" height="24" rx="12.0" fill="#1E293B" fill-opacity=".55" stroke="#22D3EE" stroke-opacity=".35"/><circle cx="49.0" cy="162.0" r="3" fill="#22D3EE"/><text x="59.0" y="166.0" font-size="11" font-weight="600" fill="#CBD5E1">React</text><rect x="112.1" y="150" width="81.7" height="24" rx="12.0" fill="#1E293B" fill-opacity=".55" stroke="#22D3EE" stroke-opacity=".35"/><circle cx="125.1" cy="162.0" r="3" fill="#22D3EE"/><text x="135.1" y="166.0" font-size="11" font-weight="600" fill="#CBD5E1">Express</text><rect x="201.8" y="150" width="88.6" height="24" rx="12.0" fill="#1E293B" fill-opacity=".55" stroke="#22D3EE" stroke-opacity=".35"/><circle cx="214.8" cy="162.0" r="3" fill="#22D3EE"/><text x="224.8" y="166.0" font-size="11" font-weight="600" fill="#CBD5E1">Firebase</text><rect x="298.4" y="150" width="95.4" height="24" rx="12.0" fill="#1E293B" fill-opacity=".55" stroke="#22D3EE" stroke-opacity=".35"/><circle cx="311.4" cy="162.0" r="3" fill="#22D3EE"/><text x="321.4" y="166.0" font-size="11" font-weight="600" fill="#CBD5E1">Gmail API</text><rect x="401.8" y="150" width="115.8" height="24" rx="12.0" fill="#1E293B" fill-opacity=".55" stroke="#22D3EE" stroke-opacity=".35"/><circle cx="414.8" cy="162.0" r="3" fill="#22D3EE"/><text x="424.8" y="166.0" font-size="11" font-weight="600" fill="#CBD5E1">Tailwind CSS</text><text x="806" y="166" text-anchor="end" font-size="11" fill="#94A3B8">open repo <tspan fill="#22D3EE">↗</tspan></text></svg>